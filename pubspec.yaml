name: v_meeting
description: "REISUB Meeting: open-source video meetings built with Flutter and LiveKit."
# Private application; never published to pub.dev.
publish_to: 'none'

# build-name is the user-visible version; build-number is the Android
# versionCode / iOS CFBundleVersion / Windows build suffix.
version: 2.0.0+5

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  livekit_client: ^2.13.2
  flutter_webrtc: ^1.6.3
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  # 13.x requires Android SDK 37, incompatible with the current Gradle setup.
  permission_handler: 12.0.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Generates lib/l10n/app_localizations*.dart from the ARB files.
  generate: true
  uses-material-design: true

  assets:
    - assets/branding/logo.png
