name: v_meeting
description: "REISUB Meeting: open-source video meetings built with Flutter and LiveKit."
# Private application; never published to pub.dev.
publish_to: 'none'

# build-name is the user-visible version; build-number is the Android
# versionCode / iOS CFBundleVersion / Windows build suffix.
version: 3.0.0+6

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  livekit_client: ^2.13.2
  flutter_webrtc: ^1.6.3
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  # 13.x requires Android SDK 37, incompatible with the current Gradle setup.
  permission_handler: 12.0.3
  web: ^1.1.1
  window_manager: ^0.5.1
  file_picker: ^13.4.1
  image: ^4.13.1
  web_socket_channel: ^3.0.3
  # 23.x compiles against Android SDK 37, which this Gradle setup does not take yet.
  flutter_local_notifications: 22.3.3
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  dbus: ^0.8.1
  # 0.6+ is a native rewrite (as window_manager 0.6), and 0.7+ needs Dart 3.13.
  tray_manager: 0.5.3
  # Incoming calls on Android: rings through the system's call service.
  reisub_calls:
    path: packages/reisub_calls
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Generates lib/l10n/app_localizations*.dart from the ARB files.
  generate: true
  uses-material-design: true

  assets:
    - assets/branding/logo.png
